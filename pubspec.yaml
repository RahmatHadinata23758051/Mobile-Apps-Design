name: "hera"
description: "HERA V2 Enhancement."
publish_to: 'none'

version: 2.0.0+1
environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  geolocator: ^14.0.2
  flutter_blue_plus: ^2.2.1
  mqtt_client: ^10.0.0
  sqflite: ^2.0.0+4
  path_provider: ^2.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  lucide_icons: ^0.257.0 
  intl: ^0.20.2
  geocoding: ^4.0.0
  shared_preferences: ^2.2.2
  path: ^1.9.1
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  pusher_channels_flutter: ^2.6.0
  safe_device: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/unhas-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/unhas-logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/user.png
    - assets/images/unhas-logo.png
